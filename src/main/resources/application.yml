spring:
  application:
    name: loanledger
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/loanledger
    username: loanledger
    password: loanledger
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  jwt:
    secret: ${JWT_SECRET:ThisIsADevelopmentSecretKeyThatShouldBeAtLeast256BitsLongForHS256Algorithm}
    expiration-ms: 86400000

logging:
  level:
    org.hibernate.SQL: debug
    com.loanledger: debug
