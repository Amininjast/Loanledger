services:
  postgres:
    image: postgres:16-alpine
    container_name: loanledger-db
    environment:
      POSTGRES_DB: loanledger
      POSTGRES_USER: loanledger
      POSTGRES_PASSWORD: loanledger
    ports:
      - "5432:5432"
    volumes:
      - loanledger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanledger -d loanledger"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  loanledger_pgdata:
